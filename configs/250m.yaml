model:
  vocab_size: 8192
  context_length: 2048
  num_layers: 34
  hidden_size: 768
  num_heads: 12
  intermediate_size: 2048
  dropout: 0.0
  tie_embeddings: true

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 2000
  max_steps: 100000
  gradient_clip: 1.0
  precision: bf16
  checkpoint_interval: 1000
  evaluation_interval: 500
  seed: 42
