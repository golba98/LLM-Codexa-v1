model:
  vocab_size: 8196
  context_length: 1024
  num_layers: 24
  hidden_size: 1536
  num_heads: 24
  intermediate_size: 6144
  dropout: 0.0
  tie_embeddings: true

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 0.00002
  weight_decay: 0.0
  warmup_steps: 50
  max_steps: 1000
  gradient_clip: 1.0
  precision: bf16
  checkpoint_interval: 100
  evaluation_interval: 50
  seed: 42
