model:
  vocab_size: 8192
  context_length: 1024
  num_layers: 16
  hidden_size: 512
  num_heads: 8
  intermediate_size: 1365
  dropout: 0.0
  tie_embeddings: true

training:
  micro_batch_size: 2
  gradient_accumulation_steps: 16
  learning_rate: 0.0003
  weight_decay: 0.1
  warmup_steps: 500
  max_steps: 10000
  gradient_clip: 1.0
  precision: bf16
  checkpoint_interval: 500
  evaluation_interval: 250
  seed: 42
