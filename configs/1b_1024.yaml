model:
  vocab_size: 8192
  context_length: 1024
  num_layers: 24
  hidden_size: 1536
  num_heads: 24
  intermediate_size: 6144
  dropout: 0.0
  tie_embeddings: true

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 32
  learning_rate: 0.0002
  weight_decay: 0.1
  warmup_steps: 2000
  max_steps: 15000
  gradient_clip: 1.0
  precision: bf16
  checkpoint_interval: 250
  evaluation_interval: 250
  seed: 42
