model:
  vocab_size: 8192
  context_length: 2048
  num_layers: 34
  hidden_size: 768
  num_heads: 12
  intermediate_size: 2048
  dropout: 0.0
  tie_embeddings: true

training:
  micro_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 0.00002
  weight_decay: 0.0
  warmup_steps: 100
  max_steps: 2661
  gradient_clip: 1.0
  precision: bf16
  checkpoint_interval: 250
  evaluation_interval: 100
  seed: 42
