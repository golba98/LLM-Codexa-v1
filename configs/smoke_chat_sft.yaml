model:
  vocab_size: 8196
  context_length: 128
  num_layers: 2
  hidden_size: 64
  num_heads: 4
  intermediate_size: 128
  dropout: 0.0
  tie_embeddings: true

training:
  micro_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 0.003
  weight_decay: 0.0
  warmup_steps: 10
  max_steps: 240
  gradient_clip: 1.0
  precision: fp32
  checkpoint_interval: 80
  evaluation_interval: 40
  seed: 42
